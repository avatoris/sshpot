# Builds both images and pushes them to Docker Hub.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  - Docker Hub account with push rights on jnltedev/*
#   DOCKERHUB_TOKEN     - access token from https://hub.docker.com/settings/security
#
# Pushing a tag like v1.2.3 publishes :1.2.3, :1.2, :1 and :latest.
# Pushes to main publish :edge only.

name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      cowrie_tag:
        description: Upstream Cowrie release to vendor
        default: v3.0.12

permissions:
  contents: read

env:
  REGISTRY_NAMESPACE: jnltedev
  # Both images must list the same platforms, or the stack won't start on the
  # architecture that is missing. arm64 is built under QEMU emulation, which
  # makes the Cowrie job noticeably slower (expect 20-40 minutes); drop it here
  # if you only ever deploy on x86.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vendor and patch Cowrie
        env:
          COWRIE_TAG: ${{ inputs.cowrie_tag || 'v3.0.12' }}
        run: ./scripts/vendor_cowrie.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels for the reporter image
        id: meta-reporter
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_NAMESPACE }}/avatoris_sshpot-reporter
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Avatoris SSH honeypot reporter
            org.opencontainers.image.description=Reports honeypot and sshd login failures to the Avatoris API
            org.opencontainers.image.licenses=MIT

      - name: Tags and labels for the Cowrie image
        id: meta-cowrie
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_NAMESPACE }}/avatoris_sshpot-cowrie
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Cowrie SSH honeypot (patched build)
            org.opencontainers.image.description=Upstream Cowrie with the docker/Dockerfile install fix applied
            org.opencontainers.image.licenses=BSD-3-Clause

      - name: Build and push the reporter image
        uses: docker/build-push-action@v6
        with:
          context: ./reporter
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-reporter.outputs.tags }}
          labels: ${{ steps.meta-reporter.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the Cowrie image
        uses: docker/build-push-action@v6
        with:
          context: ./vendor/cowrie
          file: ./vendor/cowrie/docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-cowrie.outputs.tags }}
          labels: ${{ steps.meta-cowrie.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
